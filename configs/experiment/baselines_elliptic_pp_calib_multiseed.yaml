# Revision brief item B2 (optional part): B3 trained on steps 1-29 only, so
# that steps 30-34 can calibrate it out of sample before it joins a fusion
# (fusion_gatv2_b3_multiseed.yaml). Its scores cover steps 30-49. Its own
# scoreboard, computed over steps 30-49, is not a paper number.
dataset: elliptic_pp
domain: financial
store_root: data/interim
output_dir: eval_outputs/elliptic_pp/baselines_calib_multiseed
multiseed: true
seeds: [0, 1, 2, 3, 4]
split:
  train_end: 29
  test_start: 30
budgets: [50, 100, 200]
baselines: [b3_xgb_graph]
xgb:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
