# Revision brief item B2 (and B1): the Elliptic++ tree baselines over five
# seeds. Identical to baselines_elliptic_pp.yaml except that XGBoost samples
# rows and columns (subsample and colsample_bytree 0.8, fixed before any run,
# no tuning), so the seed matters. per_time_step feeds the B1 curve (Fig. 3).
# B1 rules are deterministic and stay in baselines_elliptic_pp.yaml.
dataset: elliptic_pp
domain: financial
store_root: data/interim
output_dir: eval_outputs/elliptic_pp/baselines_multiseed
multiseed: true
seeds: [0, 1, 2, 3, 4]
split:
  train_end: 34
budgets: [50, 100, 200]
per_time_step: true
baselines: [b2_xgb, b3_xgb_graph]
xgb:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
