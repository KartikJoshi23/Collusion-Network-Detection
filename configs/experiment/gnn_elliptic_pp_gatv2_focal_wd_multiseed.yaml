# Revision brief item B7: an explicit regulariser compared with 20% label noise.
# Arm: weight decay 5e-3 (ten times the headline 5e-4). Clean labels, seeds 0-4; otherwise identical to
# gnn_elliptic_pp_gatv2_focal_multiseed.yaml. The value was fixed before any run.
budgets:
- 50
- 100
- 200
dataset: elliptic_pp
epochs: 200
features: raw
loss:
  gamma: 2.0
  name: focal
lr: 0.005
model:
  dropout: 0.3
  heads: 4
  hidden_dim: 64
  name: gatv2
  num_layers: 2
multiseed: true
output_dir: eval_outputs/elliptic_pp/gnn_gatv2_focal_wd_multiseed
patience: 20
per_time_step: true
seeds:
- 0
- 1
- 2
- 3
- 4
split:
  loss_end: 29
  test_start: 35
  train_end: 34
store_root: data/interim
weight_decay: 0.005
