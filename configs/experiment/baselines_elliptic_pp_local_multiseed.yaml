# Revision brief item B3: B2 on local features only, and B3 as local plus
# graph features. Local means the Weber et al. (2019) set: the time step plus
# Local_feature_1..93 (94 columns). It excludes the 72 one-hop aggregates, the
# 17 columns Elliptic++ added, and every edge-derived column. B3-local adds the
# structural template, the edge-derived money-flow pack, and neighbour means of
# the local columns. XGBoost settings and seeds as in
# baselines_elliptic_pp_multiseed.yaml.
dataset: elliptic_pp
domain: financial
store_root: data/interim
output_dir: eval_outputs/elliptic_pp/baselines_local_multiseed
multiseed: true
seeds: [0, 1, 2, 3, 4]
feature_set: local
split:
  train_end: 34
budgets: [50, 100, 200]
per_time_step: true
baselines: [b2_xgb, b3_xgb_graph]
xgb:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
