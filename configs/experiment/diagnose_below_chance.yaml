# Revision brief item B4: diagnose the results that sit below their prevalence
# baseline. For each case it reports the AUC-PR of the score and of its
# inversion, the label encoding, split facts, and train-versus-test feature
# distributions, with each side featurised as the models saw it, and per-window
# feature-label associations for the two cases with a training window. It reads
# stored scores only. The proc2fin_source case is not in the brief: the source
# encoder of the probe also scores below prevalence on its own Mendeley test set.
diagnostics: true
store_root: data/interim
output_dir: eval_outputs/diagnostics/below_chance
cases:
  mendeley_rgcn:
    dataset: mendeley_eu
    node_type: firm
    scores: eval_outputs/mendeley_eu/gnn_rgcn_focal_multiseed/seed_{seed}/scores_test.parquet
    seeds: [0, 1, 2, 3, 4]
    shift:
      train_end: 2013
      test_start: 2014
      features: structural
      # per-window prevalence and feature-label ROC-AUC; loss and val are the
      # R-GCN's own windows (loss_end 2010), train_all is what the trees and
      # the probe train on
      association:
        label_policy: mendeley_as_of
        windows:
          loss: {side: train, until: 2010}
          val: {side: train, after: 2010, until: 2013}
          train_all: {side: train, until: 2013}
          test: {side: test, after: 2013}
  amlworld_trees:
    dataset: amlworld_hi_small
    node_type: acct
    scores:
      b2_xgb: eval_outputs/amlworld_hi_small/baselines/scores/b2_xgb.parquet
      b3_xgb_graph: eval_outputs/amlworld_hi_small/baselines/scores/b3_xgb_graph.parquet
    shift:
      train_end: 27699900
      test_start: 27699901
      fence_after: 27714239  # as in baselines_amlworld.yaml
      features: degree
      association:
        label_policy: static
        features: financial  # the money-flow pack B2 and B3 use on AMLworld
        windows:
          train: {side: train, until: 27699900}
          test: {side: test, after: 27699900}
  # the frozen-probe scores of cross_domain_full_label_comparison.yaml (stored
  # encoder, this machine), so the paper quotes one value for this probe; the
  # original run's scores (cross_domain_probe_fin2proc.yaml) give 0.2841
  fin2proc_probe:
    dataset: mendeley_eu
    node_type: firm
    scores: eval_outputs/cross_domain/full_label_comparison/fin2proc/frozen_probe.parquet
    shift: {train_end: 2013, test_start: 2014, features: structural}
  proc2fin_source:
    dataset: mendeley_eu
    node_type: firm
    scores: eval_outputs/mendeley_eu/gnn_sage_structural_src/scores_test.parquet
  # added with gnn_mendeley_rgcn_nocomm_multiseed.yaml: the same R-GCN without
  # the two component features, which tests the component-size explanation
  mendeley_rgcn_nocomm:
    dataset: mendeley_eu
    node_type: firm
    scores: eval_outputs/mendeley_eu/gnn_rgcn_focal_nocomm_multiseed/seed_{seed}/scores_test.parquet
    seeds: [0, 1, 2, 3, 4]
