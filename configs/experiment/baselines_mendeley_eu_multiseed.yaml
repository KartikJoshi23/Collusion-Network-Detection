# Revision brief item B2: the Mendeley tree baselines (B2, B3) over five seeds,
# with the row and column sampling of baselines_elliptic_pp_multiseed.yaml.
# Otherwise identical to baselines_mendeley_eu.yaml (as-of training labels).
dataset: mendeley_eu
domain: procurement
node_type: firm
store_root: data/interim
output_dir: eval_outputs/mendeley_eu/baselines_multiseed
multiseed: true
seeds: [0, 1, 2, 3, 4]
split:
  train_end: 2013
budgets: [4, 18, 36]
baselines: [b2_xgb, b3_xgb_graph]
xgb:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
train_label_policy: mendeley_as_of
