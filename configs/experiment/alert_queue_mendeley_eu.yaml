# First procurement alert queue (M4 needs bundles on BOTH domains): Leiden on
# the Mendeley test window (firms/tenders/buyers ≥2014), members scored by the
# R-GCN run, isotonic calibration on its validation pool. Within-sample framing
# per the M1 decision; the R-GCN's weak test transfer (ledger) rides along
# honestly — the queue mechanics and bundles are what M4 validates.
dataset: mendeley_eu
domain: procurement
store_root: data/interim
# Journal revision (2026-11): the seed-0 run of gnn_mendeley_rgcn_multiseed.yaml,
# whose protocol is identical to gnn_mendeley_rgcn.yaml. The single-seed
# folder this config used to name was never stored. The previously stored
# queue was built by scripts/build_demo_artifacts.py from a different model
# (sage_struct_s0); see revision-plan.md, Section 0.2.
scores_dir: eval_outputs/mendeley_eu/gnn_rgcn_focal_multiseed/seed_0
output_dir: eval_outputs/mendeley_eu/alert_queue
model_run_id: rgcn_focal_s0
seed: 0

split:
  test_start: 2014

resolution: 1.0
min_community_size: 2
top_p: 0.25
budgets: [4, 18, 36]

# audit F1: training/calibration targets use award-derived labels AT train_end
# (the stored labels roll up a firm's entire history); test evaluation keeps
# the stored full-knowledge labels
train_label_policy: mendeley_as_of
