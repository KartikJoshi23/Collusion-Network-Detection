  - id: elliptic_b1
    file: eval_outputs/elliptic_pp/baselines/scoreboard.json
    items:
      - {id: auc, v: "0.0576", key: baselines.b1_rules.auc_pr}
      - {id: p100, v: "0.00", key: "baselines.b1_rules.precision@100", fmt: "{:.2f}"}
