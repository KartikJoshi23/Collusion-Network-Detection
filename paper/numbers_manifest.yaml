# Number manifest for paper/collusiongraph_paper.tex.
#
# Each entry names a number as printed in the manuscript (v), the artifact
# that holds it (file, under the repository root), the key path into it and
# the format used to print it. scripts/audit/verify_numbers.py recomputes the
# printed string from the artifact, confirms it appears in the manuscript,
# and lists decimals that no entry or allow item explains. Every artifact is
# produced by a committed config (Appendix A; docs/reproducibility.md).
#
# Key paths: dots separate keys; "*" fans out over a mapping or list; reduce
# folds the matches (min, max, mean, stdev, sum, count); op combines with a
# second source b (sub, div, add); scale multiplies the result.

numbers:
